<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #eee;
            flex-direction: column;
            gap: 20px;
        }

        h1 {
            font-size: 2.5rem;
            color: #4ade80;
            text-shadow: 0 0 20px rgba(74, 222, 128, 0.5);
        }

        #gameContainer {
            position: relative;
        }

        canvas {
            background: #16213e;
            border: 3px solid #4ade80;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(74, 222, 128, 0.3);
        }

        #scorePanel {
            display: flex;
            gap: 40px;
            font-size: 1.2rem;
        }

        #scorePanel span {
            color: #4ade80;
            font-weight: bold;
        }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
            gap: 15px;
        }

        #overlay h2 {
            font-size: 2rem;
            color: #ef4444;
        }

        #overlay p {
            font-size: 1.1rem;
        }

        #overlay button {
            padding: 12px 30px;
            font-size: 1.1rem;
            background: #4ade80;
            color: #1a1a2e;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.15s, box-shadow 0.15s;
        }

        #overlay button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(74, 222, 128, 0.6);
        }

        .hidden {
            display: none !important;
        }

        #instructions {
            font-size: 0.95rem;
            color: #94a3b8;
        }

        kbd {
            background: #334155;
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid #475569;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <h1>🐍 Snake</h1>

    <div id="scorePanel">
        <div>Score: <span id="score">0</span></div>
        <div>High Score: <span id="highScore">0</span></div>
    </div>

    <div id="gameContainer">
        <canvas id="game" width="400" height="400"></canvas>
        <div id="overlay" class="hidden">
            <h2 id="overlayTitle">Game Over</h2>
            <p id="overlayMsg">Final Score: 0</p>
            <button id="restartBtn">Play Again</button>
        </div>
    </div>

    <p id="instructions">Use <kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> or <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> to move &nbsp;•&nbsp; <kbd>Space</kbd> to pause</p>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('highScore');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlayTitle');
        const overlayMsg = document.getElementById('overlayMsg');
        const restartBtn = document.getElementById('restartBtn');

        const GRID_SIZE = 20;
        const TILE_COUNT = canvas.width / GRID_SIZE;
        const BASE_SPEED = 140; // ms between updates
        const MIN_SPEED = 60;

        let snake, direction, nextDirection, food, score, highScore, gameLoop, speed, paused, gameRunning;

        highScore = parseInt(localStorage.getItem('snakeHighScore')) || 0;
        highScoreEl.textContent = highScore;

        function init() {
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            direction = { x: 1, y: 0 };
            nextDirection = { x: 1, y: 0 };
            score = 0;
            speed = BASE_SPEED;
            paused = false;
            gameRunning = true;
            scoreEl.textContent = score;
            placeFood();
            overlay.classList.add('hidden');
            clearInterval(gameLoop);
            gameLoop = setInterval(tick, speed);
        }

        function placeFood() {
            let pos;
            do {
                pos = {
                    x: Math.floor(Math.random() * TILE_COUNT),
                    y: Math.floor(Math.random() * TILE_COUNT)
                };
            } while (snake.some(seg => seg.x === pos.x && seg.y === pos.y));
            food = pos;
        }

        function tick() {
            if (paused || !gameRunning) return;

            direction = nextDirection;

            // Move head
            const head = {
                x: snake[0].x + direction.x,
                y: snake[0].y + direction.y
            };

            // Wall collision
            if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
                return gameOver();
            }

            // Self collision
            if (snake.some(seg => seg.x === head.x && seg.y === head.y)) {
                return gameOver();
            }

            snake.unshift(head);

            // Eat food
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreEl.textContent = score;
                placeFood();
                // Speed up slightly, capped
                speed = Math.max(MIN_SPEED, speed - 3);
                clearInterval(gameLoop);
                gameLoop = setInterval(tick, speed);
            } else {
                snake.pop();
            }

            draw();
        }

        function draw() {
            // Clear canvas
            ctx.fillStyle = '#16213e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Subtle grid
            ctx.strokeStyle = 'rgba(255,255,255,0.04)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= TILE_COUNT; i++) {
                ctx.beginPath();
                ctx.moveTo(i * GRID_SIZE, 0);
                ctx.lineTo(i * GRID_SIZE, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * GRID_SIZE);
                ctx.lineTo(canvas.width, i * GRID_SIZE);
                ctx.stroke();
            }

            // Food
            const fx = food.x * GRID_SIZE + GRID_SIZE / 2;
            const fy = food.y * GRID_SIZE + GRID_SIZE / 2;
            const grd = ctx.createRadialGradient(fx, fy, 2, fx, fy, GRID_SIZE / 2 - 2);
            grd.addColorStop(0, '#fca5a5');
            grd.addColorStop(1, '#ef4444');
            ctx.fillStyle = grd;
            ctx.beginPath();
            ctx.arc(fx, fy, GRID_SIZE / 2 - 2, 0, Math.PI * 2);
            ctx.fill();

            // Snake
            snake.forEach((seg, i) => {
                const isHead = i === 0;
                const px = seg.x * GRID_SIZE;
                const py = seg.y * GRID_SIZE;

                if (isHead) {
                    ctx.fillStyle = '#4ade80';
                } else {
                    // Gradient body from green to teal
                    const t = i / snake.length;
                    const r = Math.round(74 + (20 - 74) * t);
                    const g = Math.round(222 + (184 - 222) * t);
                    const b = Math.round(128 + (166 - 128) * t);
                    ctx.fillStyle = `rgb(${r},${g},${b})`;
                }

                ctx.beginPath();
                const radius = isHead ? 6 : 4;
                roundRect(ctx, px + 1, py + 1, GRID_SIZE - 2, GRID_SIZE - 2, radius);
                ctx.fill();

                // Eyes on head
                if (isHead) {
                    ctx.fillStyle = '#1a1a2e';
                    const eyeOffset = 5;
                    let ex1, ey1, ex2, ey2;
                    if (direction.x === 1) {
                        ex1 = px + 13; ey1 = py + 5;
                        ex2 = px + 13; ey2 = py + 13;
                    } else if (direction.x === -1) {
                        ex1 = px + 5; ey1 = py + 5;
                        ex2 = px + 5; ey2 = py + 13;
                    } else if (direction.y === -1) {
                        ex1 = px + 5; ey1 = py + 5;
                        ex2 = px + 13; ey2 = py + 5;
                    } else {
                        ex1 = px + 5; ey1 = py + 13;
                        ex2 = px + 13; ey2 = py + 13;
                    }
                    ctx.beginPath();
                    ctx.arc(ex1, ey1, 2.5, 0, Math.PI * 2);
                    ctx.arc(ex2, ey2, 2.5, 0, Math.PI * 2);
                    ctx.fill();
                }
            });

            // Paused overlay on canvas
            if (paused && gameRunning) {
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 28px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('PAUSED', canvas.width / 2, canvas.height / 2);
            }
        }

        function roundRect(ctx, x, y, w, h, r) {
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
        }

        function gameOver() {
            gameRunning = false;
            clearInterval(gameLoop);

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snakeHighScore', highScore);
                highScoreEl.textContent = highScore;
                overlayTitle.textContent = '🏆 New High Score!';
            } else {
                overlayTitle.textContent = 'Game Over';
            }
            overlayMsg.textContent = `Final Score: ${score}`;
            overlay.classList.remove('hidden');
        }

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            const k = e.key.toLowerCase();

            if (k === ' ') {
                e.preventDefault();
                if (gameRunning) paused = !paused;
                return;
            }

            if (!gameRunning) return;

            // Prevent 180° turns
            const up = direction.y === -1;
            const down = direction.y === 1;
            const left = direction.x === -1;
            const right = direction.x === 1;

            if ((k === 'arrowup' || k === 'w') && !down) nextDirection = { x: 0, y: -1 };
            else if ((k === 'arrowdown' || k === 's') && !up) nextDirection = { x: 0, y: 1 };
            else if ((k === 'arrowleft' || k === 'a') && !right) nextDirection = { x: -1, y: 0 };
            else if ((k === 'arrowright' || k === 'd') && !left) nextDirection = { x: 1, y: 0 };

            if (['arrowup','arrowdown','arrowleft','arrowright'].includes(k)) e.preventDefault();
        });

        restartBtn.addEventListener('click', init);

        // Start
        init();
    </script>
</body>
</html>
