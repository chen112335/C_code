<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>🐍 Snake</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body {
            background: #1a1a2e;
            color: #eee;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overscroll-behavior: none;
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
            gap: 12px;
            touch-action: none;          /* 关键：禁用浏览器默认手势 */
            user-select: none;
        }
        h1 {
            font-size: clamp(1.8rem, 5vw, 2.5rem);
            color: #4ade80;
            text-shadow: 0 0 20px rgba(74,222,128,.5);
        }
        #scorePanel {
            display: flex;
            gap: clamp(20px, 8vw, 40px);
            font-size: clamp(.95rem, 3.5vw, 1.2rem);
        }
        #scorePanel span { color: #4ade80; font-weight: bold; }

        #gameContainer { position: relative; }
        canvas {
            background: #16213e;
            border: 3px solid #4ade80;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(74,222,128,.3);
            touch-action: none;
            display: block;
            max-width: 100%;
            height: auto;
        }

        /* ---------- 方向按键 (手机可见) ---------- */
        #dpad {
            display: grid;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(3, 60px);
            gap: 6px;
            margin-top: 8px;
        }
        .dpad-btn {
            background: #16213e;
            border: 2px solid #4ade80;
            border-radius: 12px;
            color: #4ade80;
            font-size: 26px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background .1s, transform .05s;
            touch-action: none;
        }
        .dpad-btn:active {
            background: #4ade80;
            color: #1a1a2e;
            transform: scale(.92);
        }
        .dpad-btn.empty { visibility: hidden; }
        #dpad .up    { grid-column: 2; grid-row: 1; }
        #dpad .left  { grid-column: 1; grid-row: 2; }
        #dpad .right { grid-column: 3; grid-row: 2; }
        #dpad .down  { grid-column: 2; grid-row: 3; }
        #dpad .pause { grid-column: 2; grid-row: 2; background: #334155; border-color: #94a3b8; color: #fff; font-size: 14px; }

        /* 桌面端隐藏虚拟按键 (可选，也可以一直显示) */
        @media (hover: hover) and (pointer: fine) {
            #dpad { display: none; }
            #instructions-mobile { display: none; }
        }
        @media (hover: none) and (pointer: coarse) {
            #instructions-pc { display: none; }
        }

        /* ---------- Overlay ---------- */
        #overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,.75);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
            gap: 15px;
            padding: 20px;
            text-align: center;
        }
        #overlay h2 { font-size: clamp(1.5rem, 6vw, 2rem); color: #ef4444; }
        #overlay p  { font-size: clamp(.95rem, 3.8vw, 1.1rem); }
        #overlay button {
            padding: 12px 30px;
            font-size: 1.1rem;
            background: #4ade80;
            color: #1a1a2e;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        #overlay button:active { transform: scale(.95); }
        .hidden { display: none !important; }

        #instructions { font-size: .9rem; color: #94a3b8; text-align: center; }
    </style>
</head>
<body>
    <h1>🐍 Snake</h1>

    <div id="scorePanel">
        <div>得分: <span id="score">0</span></div>
        <div>最高: <span id="highScore">0</span></div>
    </div>

    <div id="gameContainer">
        <canvas id="game" width="400" height="400"></canvas>
        <div id="overlay" class="hidden">
            <h2 id="overlayTitle">游戏结束</h2>
            <p id="overlayMsg">最终得分: 0</p>
            <button id="restartBtn">再来一局</button>
        </div>
    </div>

    <!-- 虚拟方向按键 -->
    <div id="dpad" aria-label="方向控制">
        <div class="dpad-btn empty"></div>
        <div class="dpad-btn up"    data-dir="up">▲</div>
        <div class="dpad-btn empty"></div>
        <div class="dpad-btn left"  data-dir="left">◀</div>
        <div class="dpad-btn pause" id="pauseBtn">暂停</div>
        <div class="dpad-btn right" data-dir="right">▶</div>
        <div class="dpad-btn empty"></div>
        <div class="dpad-btn down"  data-dir="down">▼</div>
        <div class="dpad-btn empty"></div>
    </div>

    <p id="instructions">
        <span id="instructions-pc">键盘: ↑ ↓ ← → / W A S D  &nbsp;•&nbsp; 空格暂停</span>
        <span id="instructions-mobile">滑动屏幕 或 使用下方按键控制方向</span>
    </p>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('highScore');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlayTitle');
        const overlayMsg = document.getElementById('overlayMsg');
        const restartBtn = document.getElementById('restartBtn');
        const pauseBtn = document.getElementById('pauseBtn');

        const GRID_SIZE = 20;
        const TILE_COUNT = canvas.width / GRID_SIZE;
        const BASE_SPEED = 140;
        const MIN_SPEED = 60;
        const SWIPE_THRESHOLD = 25; // 像素

        let snake, direction, nextDirection, food, score, highScore, gameLoop, speed, paused, gameRunning;

        highScore = parseInt(localStorage.getItem('snakeHighScore')) || 0;
        highScoreEl.textContent = highScore;

        function init() {
            snake = [
                { x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }
            ];
            direction = { x: 1, y: 0 };
            nextDirection = { x: 1, y: 0 };
            score = 0;
            speed = BASE_SPEED;
            paused = false;
            gameRunning = true;
            scoreEl.textContent = score;
            placeFood();
            overlay.classList.add('hidden');
            pauseBtn.textContent = '暂停';
            clearInterval(gameLoop);
            gameLoop = setInterval(tick, speed);
        }

        function placeFood() {
            let pos;
            do {
                pos = {
                    x: Math.floor(Math.random() * TILE_COUNT),
                    y: Math.floor(Math.random() * TILE_COUNT)
                };
            } while (snake.some(s => s.x === pos.x && s.y === pos.y));
            food = pos;
        }

        function setDir(dir) {
            if (!gameRunning || paused) return;
            const up    = direction.y === -1;
            const down  = direction.y === 1;
            const left  = direction.x === -1;
            const right = direction.x === 1;
            if (dir === 'up'    && !down)  nextDirection = { x: 0, y: -1 };
            else if (dir === 'down'  && !up)    nextDirection = { x: 0, y: 1 };
            else if (dir === 'left'  && !right) nextDirection = { x: -1, y: 0 };
            else if (dir === 'right' && !left)  nextDirection = { x: 1, y: 0 };
        }

        function togglePause() {
            if (!gameRunning) return;
            paused = !paused;
            pauseBtn.textContent = paused ? '继续' : '暂停';
            draw();
        }

        function tick() {
            if (paused || !gameRunning) return;
            direction = nextDirection;

            const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

            if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) return gameOver();
            if (snake.some(s => s.x === head.x && s.y === head.y)) return gameOver();

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreEl.textContent = score;
                placeFood();
                speed = Math.max(MIN_SPEED, speed - 3);
                clearInterval(gameLoop);
                gameLoop = setInterval(tick, speed);
            } else {
                snake.pop();
            }

            draw();
        }

        function draw() {
            ctx.fillStyle = '#16213e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = 'rgba(255,255,255,0.04)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= TILE_COUNT; i++) {
                ctx.beginPath(); ctx.moveTo(i*GRID_SIZE, 0); ctx.lineTo(i*GRID_SIZE, canvas.height); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, i*GRID_SIZE); ctx.lineTo(canvas.width, i*GRID_SIZE); ctx.stroke();
            }

            // 食物
            const fx = food.x*GRID_SIZE + GRID_SIZE/2;
            const fy = food.y*GRID_SIZE + GRID_SIZE/2;
            const grd = ctx.createRadialGradient(fx, fy, 2, fx, fy, GRID_SIZE/2 - 2);
            grd.addColorStop(0, '#fca5a5');
            grd.addColorStop(1, '#ef4444');
            ctx.fillStyle = grd;
            ctx.beginPath();
            ctx.arc(fx, fy, GRID_SIZE/2 - 2, 0, Math.PI*2);
            ctx.fill();

            // 蛇
            snake.forEach((seg, i) => {
                const isHead = i === 0;
                const px = seg.x * GRID_SIZE;
                const py = seg.y * GRID_SIZE;

                if (isHead) {
                    ctx.fillStyle = '#4ade80';
                } else {
                    const t = i / snake.length;
                    const r = Math.round(74 + (20-74)*t);
                    const g = Math.round(222 + (184-222)*t);
                    const b = Math.round(128 + (166-128)*t);
                    ctx.fillStyle = `rgb(${r},${g},${b})`;
                }

                ctx.beginPath();
                roundRect(ctx, px+1, py+1, GRID_SIZE-2, GRID_SIZE-2, isHead ? 6 : 4);
                ctx.fill();

                if (isHead) {
                    ctx.fillStyle = '#1a1a2e';
                    let ex1, ey1, ex2, ey2;
                    if      (direction.x === 1)  { ex1 = px+13; ey1 = py+5;  ex2 = px+13; ey2 = py+13; }
                    else if (direction.x === -1) { ex1 = px+5;  ey1 = py+5;  ex2 = px+5;  ey2 = py+13; }
                    else if (direction.y === -1) { ex1 = px+5;  ey1 = py+5;  ex2 = px+13; ey2 = py+5;  }
                    else                          { ex1 = px+5;  ey1 = py+13; ex2 = px+13; ey2 = py+13; }
                    ctx.beginPath();
                    ctx.arc(ex1, ey1, 2.5, 0, Math.PI*2);
                    ctx.arc(ex2, ey2, 2.5, 0, Math.PI*2);
                    ctx.fill();
                }
            });

            if (paused && gameRunning) {
                ctx.fillStyle = 'rgba(0,0,0,0.55)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 28px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('已暂停', canvas.width/2, canvas.height/2);
            }
        }

        function roundRect(ctx, x, y, w, h, r) {
            ctx.moveTo(x+r, y);
            ctx.lineTo(x+w-r, y);
            ctx.quadraticCurveTo(x+w, y, x+w, y+r);
            ctx.lineTo(x+w, y+h-r);
            ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
            ctx.lineTo(x+r, y+h);
            ctx.quadraticCurveTo(x, y+h, x, y+h-r);
            ctx.lineTo(x, y+r);
            ctx.quadraticCurveTo(x, y, x+r, y);
        }

        function gameOver() {
            gameRunning = false;
            clearInterval(gameLoop);
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snakeHighScore', highScore);
                highScoreEl.textContent = highScore;
                overlayTitle.textContent = '🏆 新纪录!';
            } else {
                overlayTitle.textContent = '游戏结束';
            }
            overlayMsg.textContent = `最终得分: ${score}`;
            overlay.classList.remove('hidden');
        }

        /* ===================== 键盘 ===================== */
        document.addEventListener('keydown', e => {
            const k = e.key.toLowerCase();
            if (k === ' ') { e.preventDefault(); togglePause(); return; }
            if (!gameRunning) return;
            if      (k === 'arrowup'    || k === 'w') setDir('up');
            else if (k === 'arrowdown'  || k === 's') setDir('down');
            else if (k === 'arrowleft'  || k === 'a') setDir('left');
            else if (k === 'arrowright' || k === 'd') setDir('right');
            if (['arrowup','arrowdown','arrowleft','arrowright'].includes(k)) e.preventDefault();
        });

        /* ===================== 触屏滑动 ===================== */
        let touchStartX = 0, touchStartY = 0;
        canvas.addEventListener('touchstart', e => {
            const t = e.touches[0];
            touchStartX = t.clientX;
            touchStartY = t.clientY;
        }, { passive: true });

        canvas.addEventListener('touchend', e => {
            const t = e.changedTouches[0];
            const dx = t.clientX - touchStartX;
            const dy = t.clientY - touchStartY;
            const absX = Math.abs(dx), absY = Math.abs(dy);
            if (Math.max(absX, absY) < SWIPE_THRESHOLD) return; // 不是滑动
            if (absX > absY) setDir(dx > 0 ? 'right' : 'left');
            else             setDir(dy > 0 ? 'down'  : 'up');
        }, { passive: true });

        /* ===================== 虚拟按键 ===================== */
        document.querySelectorAll('.dpad-btn[data-dir]').forEach(btn => {
            const dir = btn.dataset.dir;
            const fire = e => { e.preventDefault(); setDir(dir); };
            btn.addEventListener('touchstart', fire, { passive: false });
            btn.addEventListener('mousedown',  fire);
            btn.addEventListener('click',       fire);
        });

        pauseBtn.addEventListener('click', togglePause);
        pauseBtn.addEventListener('touchstart', e => { e.preventDefault(); togglePause(); }, { passive: false });

        restartBtn.addEventListener('click', init);

        // 防止页面滚动
        document.addEventListener('touchmove', e => {
            if (e.target.closest('#gameContainer') || e.target.closest('#dpad')) {
                e.preventDefault();
            }
        }, { passive: false });

        init();
    </script>
</body>
</html>
